name: tests

# This repo is what update.ps1 installs into C:\trading-agent on the VPS, so its contents
# place real orders — and until now nothing here was tested or even syntax-checked in CI.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # No runtime deps are installed on purpose: MetaTrader5 is Windows-only and the
          # tests stub it (see tests/conftest.py). Anything that needs a real broker call
          # is out of scope for CI and should fail loudly rather than be mocked into
          # looking like it passed.

      - name: pytest
        run: python -m pytest tests/ -q

      - name: Syntax-check every deployed script
        # The manifest installs these verbatim onto the VPS. A file that does not even
        # compile must never reach it — that is cheap to check and this repo never did.
        run: |
          python - <<'PY'
          import json, pathlib, py_compile, sys
          manifest = json.loads(pathlib.Path("hotfix-manifest.json").read_text(encoding="utf-8-sig"))
          failed = []
          for entry in manifest["files"]:
              source = pathlib.Path(entry["source"])
              if source.suffix != ".py":
                  continue
              try:
                  py_compile.compile(str(source), doraise=True)
              except py_compile.PyCompileError as exc:
                  failed.append(f"{source}: {exc.msg.strip()}")
          print(f"compiled {sum(1 for e in manifest['files'] if e['source'].endswith('.py'))} python files from the manifest")
          if failed:
              print("\n".join(failed), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify manifest checksums match the files
        # update.ps1 aborts the deploy on a SHA256 mismatch, so a stale checksum is a
        # broken deploy discovered on the VPS instead of here.
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path("hotfix-manifest.json").read_text(encoding="utf-8-sig"))
          stale = []
          for entry in manifest["files"]:
              path = pathlib.Path(entry["source"])
              if not path.exists():
                  stale.append(f"{path}: missing")
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual.lower() != entry["sha256"].lower():
                  stale.append(f"{path}: manifest {entry['sha256'][:12]} != actual {actual[:12]}")
          print(f"verified {len(manifest['files'])} manifest entries")
          if stale:
              print("\n".join(stale), file=sys.stderr)
              sys.exit(1)
          PY
